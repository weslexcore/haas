<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#16181d;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#16181d;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;">
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <span style="display:inline-block;width:14px;height:14px;border:3px solid #e8b34b;border-radius:50%;vertical-align:middle;"></span>
                <span style="font-size:22px;font-weight:650;letter-spacing:-0.02em;color:#e8eaee;vertical-align:middle;padding-left:8px;">Photon</span>
              </td>
            </tr>
            <tr>
              <td style="background:#1c1f25;border:1px solid #2a2e37;border-radius:10px;padding:28px;">
                <h1 style="margin:0 0 12px;font-size:18px;font-weight:600;color:#e8eaee;">Sign in to Photon</h1>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#a9afba;">
                  Click the button below to sign in. The link works once and expires in an hour.
                  Open it in the same browser you asked for it in.
                </p>
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block;background:#e8b34b;color:#1b1405;font-size:14px;font-weight:600;text-decoration:none;padding:11px 20px;border-radius:6px;">
                  Sign in to Photon
                </a>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#727a88;">
                  If you didn't ask to sign in, you can ignore this email. Nobody can sign in without this link.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
